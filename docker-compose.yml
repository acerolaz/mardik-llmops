services:
  # L'application : /v1 (historique), /v2 (à livrer), /analyse (gateway canary).
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LLM_PROXY_URL: http://proxy:8080
      METRICS_PATH: /app/ops/metrics.jsonl
      REGISTRY_PATH: /app/ops/registry
    volumes:
      - ./ops:/app/ops          # registre, journal et métriques partagés avec le dashboard
      - ./models:/app/models
      - ./eval:/app/eval
    depends_on:
      - proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre Ollama sur la machine hôte

  # Le proxy de dérive, entre l'app et le fournisseur LLM (Azure ou Ollama).
  proxy:
    build: .
    command: python -m ops.drift_proxy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Le tableau de bord (ops/dashboard.py) : http://localhost:8501
  dashboard:
    build: .
    command: python -m ops.dashboard --serve --port 8501
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      METRICS_PATH: /app/ops/metrics.jsonl
      REGISTRY_PATH: /app/ops/registry
    volumes:
      - ./ops:/app/ops
      - ./eval:/app/eval        # candidats.jsonl : compteur « candidats à verser »
    depends_on:
      - app

  # Le pilote : surveillance, rollback automatique, promotion canary pilotée
  # par les métriques (python -m ops.deploy piloter, une tour toutes les 5 s).
  pilote:
    build: .
    command: python -m ops.deploy piloter
    restart: unless-stopped   # une tour en échec (I/O transitoire) ne doit pas arrêter le pilote
    env_file: .env
    environment:
      METRICS_PATH: /app/ops/metrics.jsonl
      REGISTRY_PATH: /app/ops/registry
    volumes:
      - ./ops:/app/ops          # métriques, registre, journal, seuils partagés
      - ./eval:/app/eval        # eval/seuils.yaml suivi au journal
    depends_on:
      - app
