# Chaîne CI/CD Mardik — gates bloquants → build → artefact étiqueté → canary.
# Le canary tourne sur le runner auto-hébergé de prod ; la suite du pilotage
# (50 %, 100 %, rollback) passe par promotion.yml et rollback.yml.
#
# Deux niveaux de gate d'évaluation :
#   * gate-evaluation : MOCK=on, les 12 contrats, à chaque PR et fusion — la CI
#     ne paie pas et ne dépend pas du fournisseur ;
#   * gate-release : vrai modèle (3 passes), sur tag v* ou lancement manuel.
# La publication relit le rapport du gate (un seul rapport fait foi), dépose
# la version dans le registre du runner, l'envoie en artefact, puis pose le
# tag git vX.Y.Z (les tags sont la mémoire des versions publiées).
#
# Équivalent local : `make ci`.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MOCK: "on"
  DRIFT: "off"
  LLM_PROVIDER: ollama
  LLM_MODEL: modele-ci
  OTEL_TRACES: "off"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Tests unitaires (pipeline v2, gate, versions)
        run: uv run pytest -q tests/unit
      - name: Tests d'intégration (hérités de la remédiation + v2 + gate + publication)
        run: uv run pytest -q tests/integration
      - name: Tests d'acceptance (le brief)
        run: uv run pytest -q tests/acceptance

  gate-evaluation:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Gate d'évaluation (MOCK, 12 contrats, seuils de eval/seuils.yaml)
        run: uv run python -m eval.run_eval --version v2 --sortie eval/rapport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-mock
          path: |
            eval/rapport.json
            eval/history.jsonl
          if-no-files-found: warn

  gate-release:
    needs: gate-evaluation
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    env:
      MOCK: "off"
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
      AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
      LLM_PROXY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Proxy LLM (l'app parle toujours au proxy, jamais au fournisseur)
        run: |
          nohup uv run python -m ops.drift_proxy > proxy.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/_drift && exit 0
            sleep 1
          done
          cat proxy.log
          exit 1
      - name: Gate de release (vrai modèle, 3 passes)
        run: uv run python -m eval.run_eval --version v2 --essais 3 --sortie eval/rapport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reel
          path: |
            eval/rapport.json
            eval/history.jsonl
          if-no-files-found: warn

  build:
    needs: [gate-evaluation, gate-release]
    if: >-
      always()
      && needs.gate-evaluation.result == 'success'
      && needs.gate-release.result != 'failure'
      && needs.gate-release.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image de l'application
        run: docker build -t mardik:${{ github.sha }} .

  publication:
    needs: [build, gate-release]
    if: >-
      always()
      && needs.build.result == 'success'
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.etiquetage.outputs.version }}
    permissions:
      contents: write
    concurrency:
      group: publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Rapport du gate de release (vrai modèle)
        if: needs.gate-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gate-reel
          path: .
      - name: Rapport du gate mock (repli)
        if: needs.gate-release.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: gate-mock
          path: eval
      - name: Étiquetage dans le registre
        id: etiquetage
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION_ARG=""
          if [ "$REF_TYPE" = "tag" ]; then VERSION_ARG="$REF_NAME"; fi
          uv run python -m ops.deploy publier $VERSION_ARG \
            --commit "${GITHUB_SHA::7}" --rapport eval/rapport.json > manifest.json
          cat manifest.json
          VERSION=$(jq -r .version manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mardik-${{ env.VERSION }}
          path: |
            ops/registry/${{ env.VERSION }}/
            ops/registry/journal.jsonl
            manifest.json
          if-no-files-found: error
      - name: Tag git de la version (après l'artefact)
        if: github.ref_type != 'tag'
        run: |
          if [ "$(git rev-list -n1 "refs/tags/$VERSION" 2>/dev/null)" = "$GITHUB_SHA" ]; then
            echo "tag $VERSION déjà posé sur ce commit (relance) — rien à faire"
          else
            git tag "$VERSION" && git push origin "$VERSION"
          fi

  # Prod : runner auto-hébergé sur la machine de démo, qui écrit dans le registre
  # monté par le docker compose (variable de dépôt MARDIK_REGISTRY_PATH).
  deploiement-canary:
    needs: publication
    if: >-
      always()
      && needs.publication.result == 'success'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, mardik]
    environment: production
    concurrency:
      group: mardik-production
      cancel-in-progress: false
    env:
      REGISTRY_PATH: ${{ vars.MARDIK_REGISTRY_PATH }}
      MARDIK_APP_URL: ${{ vars.MARDIK_APP_URL || 'http://localhost:8000' }}
      VERSION: ${{ needs.publication.outputs.version }}
      ORIGINE: ci:${{ github.actor }}
    steps:
      - name: Préconditions
        run: |
          if [ -z "$VERSION" ]; then echo "::error::publication n'a exposé aucune version"; exit 1; fi
          if [ -z "$REGISTRY_PATH" ]; then echo "::error::variable MARDIK_REGISTRY_PATH absente"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: mardik-${{ needs.publication.outputs.version }}
          path: ${{ runner.temp }}/mardik
      - name: Installation dans le registre de prod
        run: |
          uv run python -m ops.deploy installer "$VERSION" \
            --depuis "$RUNNER_TEMP/mardik/ops/registry/$VERSION" --origine "$ORIGINE"
      - name: Canary 10 %
        run: uv run python -m ops.deploy canary "$VERSION" --pourcentage 10 --origine "$ORIGINE"
      - name: État vu par la gateway
        run: curl -sf "$MARDIK_APP_URL/gateway/etat"
