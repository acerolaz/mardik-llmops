# Chaîne LLMOps — squelette [TEMPLATE].
#
# Les étapes sont posées dans l'ordre ; les gates marqués TODO sont à
# compléter par les apprenants. Tout tourne avec MOCK=on : la CI ne doit ni
# payer ni dépendre du fournisseur. Seul le gate « de release » (déclenché à
# la main ou sur tag) a vocation à appeler le vrai modèle.
#
# Équivalent local : `make ci`.

name: llmops

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MOCK: "on"
  DRIFT: "off"
  LLM_PROVIDER: ollama
  LLM_MODEL: modele-ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Tests unitaires (pipeline v2)
        run: uv run pytest -q tests/unit
      - name: Tests d'intégration (hérités de la remédiation + v2)
        run: uv run pytest -q tests/integration
      - name: Tests d'acceptance (le brief)
        run: uv run pytest -q tests/acceptance

  gate-evaluation:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      # TODO gate d'évaluation : exécuter `python -m eval.run_eval --version v2 --seuil 0.75`
      #      (MOCK=on ici ; décider ce que la CI peut vérifier sans le vrai modèle),
      #      publier eval/history.jsonl en artefact de build, échouer si le gate échoue.
      - run: echo "TODO gate d'évaluation"

  build:
    needs: gate-evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image de l'application
        run: docker build -t mardik:${{ github.sha }} .

  publication:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO publication artefact : étiqueter la version (vX.Y.Z) dans ops/registry
      #      via `python -m ops.deploy publier vX.Y.Z` avec le commit et la note du gate,
      #      et conserver le dossier de version en artefact de build.
      - run: echo "TODO publication artefact"

  deploiement-canary:
    needs: publication
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      # TODO déploiement canary : `python -m ops.deploy canary vX.Y.Z --pourcentage 10`,
      #      puis surveillance (`python -m ops.deploy surveiller`) et promotion ou rollback.
      - run: echo "TODO déploiement canary"
